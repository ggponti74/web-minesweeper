<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#f5f5f5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Minesweeper</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="app">

        <header class="game-header">
            <div id="mine-counter" aria-label="Mines remaining">
                <span class="mine-icon">💣</span>
                <span id="mine-count">32</span>
            </div>

            <div id="timer" aria-label="Elapsed time">0:00</div>
        </header>

        <section id="board-container" aria-label="Minesweeper board">
            <div id="board"></div>
        </section>

        <p>Made with AI</>

        <footer class="game-footer">
            <button id="sound-toggle"
                    type="button"
                    aria-label="Toggle sound"
                    aria-pressed="true">
                🔊
            </button>

            <button id="new-game"
                    type="button">
                New Game
            </button>
        </footer>

    </main>

    <div id="result-overlay" class="hidden" role="dialog" aria-modal="true">
        <div class="result-card">
            <div id="result-icon"></div>
            <h1 id="result-title"></h1>
            <p id="result-time"></p>
            <p id="result-record" class="hidden"></p>

            <button id="result-new-game" type="button">
                New Game
            </button>
        </div>
    </div>

<footer class="app-footer">
    <span>Version 1.0 • Made with </span>
    <a
        href="https://chatgpt.com/"
        target="_blank"
        rel="noopener noreferrer"
    >ChatGPT</a>
</footer>

    <script src="app.js"></script>
</body>
</html>
